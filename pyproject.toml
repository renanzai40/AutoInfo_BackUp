[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoinfo"
dynamic = ["version"]
description = "Universal information tracking and knowledge base platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "AutoInfo contributors"},
]

keywords = ["information-tracking", "knowledge-base", "mcp", "llm", "rss"]

classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: News/Diary",
]

dependencies = [
    # CLI & Config
    "typer>=0.12",
    "pyyaml>=6.0",

    # HTTP & Networking
    "httpx>=0.27",

    # REST API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",

    # LLM
    "litellm>=1.40",

    # Collection
    "feedparser>=6.0",
    "trafilatura>=1.8",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",

    # KB
    "python-frontmatter>=1.1",
    "markdown>=3.5",

    # Language detection
    "langdetect>=1.0.9",

    # Search
    "sqlite-vec>=0.1",

    # MCP Server
    "mcp>=1.0,<3.0",

    # Utilities
    "jinja2>=3.1",
    "python-dateutil>=2.8",
    "pyrate-limiter>=3.0",

    # Cron scheduling
    "croniter>=2.0",

    # Billing (Stripe)
    "stripe>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.1",
    "pytest-mock>=3.14",
    "pytest-vcr>=1.0.2",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "jsonschema>=4.23",
]
web = [
    "playwright>=1.45",
]
pdf = [
    "PyMuPDF>=1.23.0",
    "weasyprint>=62.0",
]
tts = [
    "edge-tts>=6.1",
]
video = [
    "pillow>=10.0",
]
ebook = [
    "ebooklib>=0.20",
    "mutagen>=1.47",
]
akshare = [
    "akshare>=1.12",
]
all = ["autoinfo[dev,web,pdf,tts,video,ebook,akshare]"]

[project.urls]
Homepage = "https://github.com/1StepMore/AutoInfo"
Documentation = "https://github.com/1StepMore/AutoInfo#readme"

[project.scripts]
autoinfo = "autoinfo.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "autoinfo._version.__version__"}

[tool.setuptools.package-data]
autoinfo = ["py.typed", "data/*.yaml", "data/domains/*/sources.yaml", "data/templates/*.j2"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

# Pre-existing lint debt — CI yml declares "Cleanup is a separate tracked
# work item" (ci.yml:863 pre-existing errors).  server.py:214 errors (211
# E501 + 2 F841 + 1 N806) injected by direct commit 2026-08-08 bypassing
# PR gates; never lint-cleaned.  Suppressing here so the changed-files gate
# catches NEW errors without blocking legacy file touches.
[tool.ruff.lint.per-file-ignores]
"src/autoinfo/mcp/server.py" = ["E501", "F841", "N806"]
# video.py: added 2026-08-13 (64daae5) with 39 pre-existing E501 long lines;
# never lint-cleaned. Suppressing here so the changed-files gate catches NEW
# errors without blocking legacy file touches (same rationale as server.py).
"src/autoinfo/output/video.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# pytest-timeout: bound every test so the suite can never hang indefinitely.
# Method auto-selects: signal on POSIX (interrupts subprocess waits), thread on Windows.
# A stuck test fails with a clear "Timeout" message instead of hanging the run.
timeout = 180
markers = [
    "slow: long-running tests (e.g. nested subprocess re-runs of older test files); included by default, CI may opt out with -m 'not slow'",
]
