# Keyword management tools — list, approve, reject.
# approve_keyword and reject_keyword mutate
# knowledge/medical-research/_keywords.yaml (state + updated_at), so the
# scenario is self-cleaning: the first step snapshots the file bytes to a
# temp backup and the final step restores them, leaving _keywords.yaml
# byte-identical to its pre-run state.  The restore step is a no-op when no
# backup exists (backup step failed — nothing was mutated).
# The approve/reject steps target preset keywords that are not guaranteed to
# exist in the runtime store, so two kind: cli steps seed them (auto_added
# state, source "scenario-seed") between the backup and the mutations;
# the final restore reverts the additions.
# suggest_keywords is LLM-required and covered by the llm-gated scenario.
name: keyword-management
description: "Keyword lifecycle: list, approve, reject (self-cleaning via backup/restore)"
category: topic
requires_env: []
requires_domain: ["medical-research"]
steps:
  - name: "backup _keywords.yaml before mutation"
    kind: cli
    tool: _cli_cleanup
    command: "python3 -c \"import shutil; shutil.copyfile('knowledge/medical-research/_keywords.yaml', '/tmp/autoinfo-scenario-keywords-backup.yaml'); print('BACKUP_OK')\""
    expect:
      exit_code: 0
      stdout_has: ["BACKUP_OK"]

  - name: "list_keywords returns keywords for medical-research"
    tool: list_keywords
    arguments:
      domain: medical-research
    expect:
      success: true
      data_has: ["domain", "topics", "count", "keywords_file"]

  - name: "list_keywords with topic filter"
    tool: list_keywords
    arguments:
      domain: medical-research
      topic: "IVF breakthroughs"
    expect:
      success: true
      data_has: ["domain", "topic", "topics"]

  - name: "seed keyword 'multicenter' before approve"
    kind: cli
    tool: _cli_cleanup
    command: "python3 -c \"from autoinfo.keywords import KeywordsFile; e=KeywordsFile().add_keyword(domain='medical-research', keyword='multicenter', state='auto_added', source='scenario-seed'); print('SEEDED:multicenter')\""
    expect:
      exit_code: 0
      stdout_has: ["SEEDED:multicenter"]

  - name: "seed keyword 'time-lapse embryo imaging' before reject"
    kind: cli
    tool: _cli_cleanup
    command: "python3 -c \"from autoinfo.keywords import KeywordsFile; e=KeywordsFile().add_keyword(domain='medical-research', keyword='time-lapse embryo imaging', state='auto_added', source='scenario-seed'); print('SEEDED:time-lapse embryo imaging')\""
    expect:
      exit_code: 0
      stdout_has: ["SEEDED:time-lapse embryo imaging"]

  - name: "approve_keyword changes keyword to verified state"
    tool: approve_keyword
    arguments:
      domain: medical-research
      keyword: "multicenter"
    expect:
      success: true

  - name: "reject_keyword marks keyword as deprecated"
    tool: reject_keyword
    arguments:
      domain: medical-research
      keyword: "time-lapse embryo imaging"
    expect:
      success: true

  - name: "cleanup: restore _keywords.yaml from backup"
    kind: cli
    tool: _cli_cleanup
    command: "python3 -c \"import os, shutil; b='/tmp/autoinfo-scenario-keywords-backup.yaml'; p='knowledge/medical-research/_keywords.yaml'; (shutil.copyfile(b, p), os.remove(b)) if os.path.isfile(b) else None; print('KEYWORDS_RESTORED')\""
    expect:
      exit_code: 0
      stdout_has: ["KEYWORDS_RESTORED"]
