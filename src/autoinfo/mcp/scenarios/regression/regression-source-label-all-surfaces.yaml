# Regression #325: specific source labels across ALL product surfaces.
#
# The #323/#325 fix (_derive_source_label) was applied at only the report
# references and digest product-context builders, so stale pre-#323 entries
# (source_platform='rss') still rendered the generic "(RSS)" label on the
# entry-level surfaces: the digest markdown entry table, the magazine-digest
# byline + per-title clusters, the digest json/agent formats, and the report
# agent payload.  The _source_labels_specific matrix assertion also only
# scanned AFTER the References heading, so masthead/byline/table residue
# escaped detection (false green).
#
# The fix: generate_digest enriches every entry with a derived source_label
# (via _label_entries) before the context is built; the digest/magazine
# templates render source_label; the report agent path derives the label per
# item; and _source_labels_specific scans the WHOLE body.
#
# Deterministic (requires_env: []): KBStore + LLM seams are patched in the
# subprocess (same pattern as tests/output/test_source_label_surfaces.py), so
# the scenario runs in a bare sandbox — no LLM key, no network.  Runs in an
# ABSOLUTE temp cwd.
name: regression-source-label-all-surfaces
description: "Regression #325: specific source labels render on every product surface (digest table, magazine byline/clusters, json/agent, report agent) + whole-body matrix scan"
category: regression
regression: true
regression_issue: "#325"
requires_env: []
steps:
  - name: "digest markdown entry table renders the specific source name, not (RSS)"
    kind: cli
    command: |-
      python3 -c '
      import os, shutil, tempfile
      from pathlib import Path
      from unittest.mock import MagicMock, patch
      import yaml
      from autoinfo.output import generate_digest

      STALE = {
          "entry_id": "e-325", "title": "AI startup raises $50M",
          "summary": "TechCrunch reports on the funding round.",
          "source_url": "https://techcrunch.com/2026/01/01/ai-startup",
          "source_type": "rss", "source_platform": "rss",
          "relevance_score": 90.0, "tags": "[]", "tier": "01-Raw",
          "collected_at": "2026-08-19T10:00:00Z",
      }
      SYNTH = {"executive_summary": "Synthesis.", "key_findings": [],
               "recommendations": []}

      tmp = Path(tempfile.mkdtemp(prefix="regression-325-a-"))
      old = os.getcwd()
      try:
          cfg_dir = tmp / ".autoinfo"
          cfg_dir.mkdir(parents=True)
          cfg = {"project": {"name": "test"},
                 "llm": {"provider": "openai", "model": "deepseek-v4-flash"},
                 "domains": [{"name": "ai-commercial", "active": True,
                              "sources": [{"name": "techcrunch", "type": "rss",
                                           "url": "https://techcrunch.com/feed/"}],
                              "topics": []}]}
          (cfg_dir / "config.yaml").write_text(
              yaml.safe_dump(cfg, allow_unicode=True, sort_keys=False),
              encoding="utf-8")
          os.chdir(tmp)
          with patch("autoinfo.output.KBStore") as kb_cls, \
               patch("autoinfo.output._call_llm_for_digest", return_value=SYNTH):
              kb = MagicMock()
              kb.list_entries.return_value = [STALE]
              kb_cls.return_value = kb
              out = generate_digest(domain="ai-commercial", period="weekly",
                                    format="markdown")
          assert isinstance(out, str), type(out)
          assert "techcrunch" in out, "specific source name missing"
          assert "(RSS)" not in out, "(RSS) residue in digest entry table"
          assert "RSS" not in out, "RSS residue in digest entry table"
          print("SOURCE_SURFACE_OK")
      finally:
          os.chdir(old)
          shutil.rmtree(tmp, ignore_errors=True)
      '
    expect:
      success: true
      exit_code: 0
      stdout_has: ["SOURCE_SURFACE_OK"]

  - name: "magazine-digest byline + per-title clusters use the specific source name"
    kind: cli
    command: |-
      python3 -c '
      import os, shutil, tempfile
      from pathlib import Path
      from unittest.mock import MagicMock, patch
      import yaml
      from autoinfo.output import PRODUCT_TEMPLATES, generate_digest

      STALE = {
          "entry_id": "e-325", "title": "AI startup raises $50M",
          "summary": "TechCrunch reports on the funding round.",
          "source_url": "https://techcrunch.com/2026/01/01/ai-startup",
          "source_type": "rss", "source_platform": "rss",
          "relevance_score": 90.0, "tags": "[]", "tier": "01-Raw",
          "collected_at": "2026-08-19T10:00:00Z",
      }
      SYNTH = {"executive_summary": "Synthesis.", "key_findings": [],
               "recommendations": []}

      def tmpl(name):
          return next(r["template"] for r in PRODUCT_TEMPLATES
                      if r["name"] == name)

      tmp = Path(tempfile.mkdtemp(prefix="regression-325-b-"))
      old = os.getcwd()
      try:
          cfg_dir = tmp / ".autoinfo"
          cfg_dir.mkdir(parents=True)
          cfg = {"project": {"name": "test"},
                 "llm": {"provider": "openai", "model": "deepseek-v4-flash"},
                 "domains": [{"name": "ai-commercial", "active": True,
                              "sources": [{"name": "techcrunch", "type": "rss",
                                           "url": "https://techcrunch.com/feed/"}],
                              "topics": []}]}
          (cfg_dir / "config.yaml").write_text(
              yaml.safe_dump(cfg, allow_unicode=True, sort_keys=False),
              encoding="utf-8")
          os.chdir(tmp)
          with patch("autoinfo.output.KBStore") as kb_cls, \
               patch("autoinfo.output._call_llm_for_digest", return_value=SYNTH):
              kb = MagicMock()
              kb.list_entries.return_value = [STALE]
              kb_cls.return_value = kb
              out = generate_digest(domain="ai-commercial", period="weekly",
                                    format="markdown",
                                    product_template=tmpl("magazine-digest"))
          assert isinstance(out, str), type(out)
          assert "techcrunch" in out, "specific source name missing"
          assert "**techcrunch**" in out, "cluster header missing"
          assert "## techcrunch" in out, "per-title cluster heading missing"
          assert "(RSS)" not in out, "(RSS) residue in magazine byline/clusters"
          assert "RSS" not in out, "RSS residue in magazine byline/clusters"
          print("SOURCE_SURFACE_OK")
      finally:
          os.chdir(old)
          shutil.rmtree(tmp, ignore_errors=True)
      '
    expect:
      success: true
      exit_code: 0
      stdout_has: ["SOURCE_SURFACE_OK"]

