  - name: "_source_labels_specific scans the whole body — masthead RSS fails loudly"
    kind: cli
    command: |-
      python3 -c '
      from autoinfo import validation_matrix as vm

      # RSS residue in the masthead/byline position with NO References heading:
      # the whole-body scan must reject it (previously only the text AFTER the
      # References heading was scanned, so this escaped detection).
      masthead = (
          "# Weekly Digest — ai-commercial\n\n"
          "*RSS* · relevance 90.0/100\n\n"
          "## Entries\n\n"
          "| **Source** | RSS |\n"
      )
      r = vm._source_labels_specific(masthead, "ai-commercial", "magazine-digest")
      assert not r.passed, f"masthead RSS escaped whole-body scan: {r.details!r}"

      # RSS residue BEFORE a References section also fails.
      with_refs = (
          "# T\n\n*RSS* · relevance 90.0/100\n\n"
          "## References\n\n1. **A** — https://x.com (techcrunch)\n"
      )
      r2 = vm._source_labels_specific(with_refs, "ai-commercial", "magazine-digest")
      assert not r2.passed, f"pre-References RSS escaped whole-body scan: {r2.details!r}"

      # A clean body (specific names only) passes.
      clean = (
          "# Weekly Digest — ai-commercial\n\n"
          "*techcrunch* · relevance 90.0/100\n\n"
          "## References\n\n1. **A** — https://techcrunch.com/1 (techcrunch)\n"
      )
      assert vm._source_labels_specific(clean, "ai-commercial", "magazine-digest").passed
      print("SOURCE_SURFACE_OK")
      '
    expect:
      success: true
      exit_code: 0
      stdout_has: ["SOURCE_SURFACE_OK"]
