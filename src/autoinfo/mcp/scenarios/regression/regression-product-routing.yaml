# Regression (output-quality-mega plan, Phase A): product-template routing must
# never silently regress to the single-template hardcode.  Before the plan,
# generate_report hardcoded product_type = "report" for every non-column
# product and magazine-digest was routed through generate_report, so all
# products rendered the same layout.  Fixes: guard-first
# _resolve_report_product_type (mirrors _resolve_digest_product_type),
# _normalize_digest_product_context (flat §2.1 keys on the digest path),
# magazine-digest → generate_digest.
#
# This scenario drives the DIGEST-PATH invocation of the #156 pattern
# (scenarios/output-premium-products.yaml lines 30-34:
# generate_digest(domain=..., period=..., format='markdown',
# product_template=<registry row>)) and asserts:
#   (a) premium-briefing renders NON-EMPTY differentiated sections
#       ("## Key Takeaways" with numbered takeaways + executive summary),
#   (b) magazine-digest renders "## In This Issue" with per-title clusters,
#   (c) the two product renders are structurally distinct from EACH OTHER
#       and from a standard digest AND a standard report.
#
# Deterministic (requires_env: []): the KBStore and LLM seams are patched in
# the subprocess (same pattern as tests/test_digest_context_normalization.py),
# so the scenario runs in a bare sandbox — no LLM key, no network, no
# configured domain.  Runs inside an ABSOLUTE temp cwd (tempfile.mkdtemp,
# try/finally cleanup) so no repo or project config can influence rendering.
# Failure means the routing/normalization regressed — never a silent skip.
name: regression-product-routing
description: "Regression output-quality-mega: premium-briefing/magazine-digest render non-empty and structurally distinct on the digest path"
category: regression
regression: true
regression_issue: "#output-quality-mega"
requires_env: []
steps:
  - name: "premium-briefing digest-path render is non-empty and differentiated"
    kind: cli
    command: |-
      python3 -c '
      import json, os, shutil, tempfile
      from pathlib import Path
      from unittest.mock import MagicMock, patch
      from autoinfo.output import PRODUCT_TEMPLATES, generate_digest

      ENTRIES = [
          {"entry_id": "e1", "title": "Improved IVF outcomes with time-lapse imaging",
           "summary": "Time-lapse imaging improves live birth rates in IVF.",
           "source_url": "https://example.com/ivf-1", "source_type": "api",
           "source_platform": "pubmed", "relevance_score": 92.0,
           "tags": json.dumps(["IVF", "embryo"]), "tier": "01-Raw",
           "collected_at": "2026-07-15T10:00:00Z"},
          {"entry_id": "e2", "title": "AI embryo selection: a systematic review",
           "summary": "AI models show promise but lack prospective validation.",
           "source_url": "https://example.com/ivf-2", "source_type": "api",
           "source_platform": "pubmed", "relevance_score": 85.0,
           "tags": json.dumps(["AI", "IVF"]), "tier": "01-Raw",
           "collected_at": "2026-07-16T10:00:00Z"},
      ]
      SYNTH = {
          "executive_summary": "IVF technology advanced with time-lapse imaging and AI selection.",
          "key_findings": [
              {"topic": "Time-lapse imaging", "detail": "Significant improvement in live birth rates."},
              {"topic": "AI embryo selection", "detail": "Promising but lacks prospective validation."},
          ],
          "recommendations": ["Support prospective AI validation trials."],
          "implications": ["Clinics should evaluate time-lapse imaging adoption."],
          "risks": [{"title": "Validation lag", "likelihood": "high", "impact": "medium",
                     "mitigation": "Run prospective trials."}],
          "action_required": ["Fund prospective AI validation trials."],
      }

      def tmpl(name):
          return next(r["template"] for r in PRODUCT_TEMPLATES if r["name"] == name)

      tmp = Path(tempfile.mkdtemp(prefix="regression-product-routing-a-"))
      old = os.getcwd()
      try:
          os.chdir(tmp)
          with patch("autoinfo.output.KBStore") as kb_cls, \
               patch("autoinfo.output._call_llm_for_digest", return_value=SYNTH):
              kb = MagicMock()
              kb.list_entries.return_value = ENTRIES
              kb_cls.return_value = kb
              out = generate_digest(domain="medical-research", period="weekly",
                                    format="markdown",
                                    product_template=tmpl("premium-briefing"),
                                    include_stale=True)
          assert isinstance(out, str), type(out)
          # Differentiated sections NON-EMPTY on the digest path (#156 pattern).
          assert "## Key Takeaways" in out, "missing Key Takeaways section"
          assert "### 1. Time-lapse imaging: Significant improvement" in out, \
              "numbered takeaway empty on digest path"
          assert "IVF technology advanced" in out, "executive summary empty on digest path"
          assert "Premium Briefing \u00b7 " in out, "premium footer missing"
          assert "## In This Issue" not in out, "leaked magazine section"
          print("PREMIUM_BRIEFING_DIGEST_OK")
      finally:
          os.chdir(old)
          shutil.rmtree(tmp, ignore_errors=True)
      '
    expect:
      success: true
      exit_code: 0
      stdout_has: ["PREMIUM_BRIEFING_DIGEST_OK"]

  - name: "magazine-digest digest-path render has In This Issue and title clusters"
    kind: cli
    command: |-
      python3 -c '
      import json, os, shutil, tempfile
      from pathlib import Path
      from unittest.mock import MagicMock, patch
      from autoinfo.output import PRODUCT_TEMPLATES, generate_digest

      ENTRIES = [
          {"entry_id": "e1", "title": "The Quiet AI Revolution in Newsrooms",
           "summary": "Newsrooms are quietly adopting AI tools for copy editing.",
           "source_url": "https://www.theatlantic.com/tech/archive/2026/07/ai-newsrooms/",
           "source_type": "rss", "source_platform": "the-atlantic",
           "relevance_score": 91.0, "tags": json.dumps(["AI", "journalism"]),
           "tier": "01-Raw", "collected_at": "2026-07-29T10:00:00Z"},
          {"entry_id": "e2", "title": "Why Wired Readers Trust Slow Journalism",
           "summary": "Long-form reporting builds trust in an age of speed.",
           "source_url": "https://www.wired.com/story/slow-journalism-trust/",
           "source_type": "rss", "source_platform": "wired",
           "relevance_score": 84.0, "tags": json.dumps(["journalism", "trust"]),
           "tier": "01-Raw", "collected_at": "2026-07-29T11:00:00Z"},
      ]
      SYNTH = {
          "executive_summary": "Magazine coverage spans AI in newsrooms and slow journalism.",
          "key_findings": [{"topic": "AI adoption", "detail": "Newsrooms scale AI quietly."}],
          "trends": ["Trust-centric journalism"],
          "recommendations": ["Watch the Atlantic AI desk."],
      }

      def tmpl(name):
          return next(r["template"] for r in PRODUCT_TEMPLATES if r["name"] == name)

      tmp = Path(tempfile.mkdtemp(prefix="regression-product-routing-b-"))
      old = os.getcwd()
      try:
          os.chdir(tmp)
          with patch("autoinfo.output.KBStore") as kb_cls, \
               patch("autoinfo.output._call_llm_for_digest", return_value=SYNTH):
              kb = MagicMock()
              kb.list_entries.return_value = ENTRIES
              kb_cls.return_value = kb
              out = generate_digest(domain="general-news", period="weekly",
                                    format="markdown",
                                    product_template=tmpl("magazine-digest"),
                                    include_stale=True)
          assert isinstance(out, str), type(out)
          # Magazine-differentiated sections on the digest path.
          assert "## In This Issue" in out, "missing In This Issue index"
          assert "Magazine Edition" in out, "missing cover masthead"
          assert "Magazine Digest \u00b7 " in out, "magazine footer missing"
          assert "the-atlantic" in out and "wired" in out, "per-title clusters missing"
          assert "The Quiet AI Revolution in Newsrooms" in out, "entry missing from clusters"
          assert "## Key Takeaways" not in out, "leaked premium section"
          print("MAGAZINE_DIGEST_OK")
      finally:
          os.chdir(old)
          shutil.rmtree(tmp, ignore_errors=True)
      '
    expect:
      success: true
      exit_code: 0
      stdout_has: ["MAGAZINE_DIGEST_OK"]

  - name: "product renders are structurally distinct from each other and from standard digest/report"
    kind: cli
    command: |-
      python3 -c '
      import json, os, shutil, tempfile
      from pathlib import Path
      from unittest.mock import MagicMock, patch
      from autoinfo.models import ExtractionResult
      from autoinfo.output import PRODUCT_TEMPLATES, generate_digest, generate_report

      ENTRIES = [
          {"entry_id": "e1", "title": "Improved IVF outcomes with time-lapse imaging",
           "summary": "Time-lapse imaging improves live birth rates in IVF.",
           "source_url": "https://example.com/ivf-1", "source_type": "api",
           "source_platform": "pubmed", "relevance_score": 92.0,
           "tags": json.dumps(["IVF", "embryo"]), "tier": "01-Raw",
           "collected_at": "2026-07-15T10:00:00Z"},
          {"entry_id": "e2", "title": "AI embryo selection: a systematic review",
           "summary": "AI models show promise but lack prospective validation.",
           "source_url": "https://example.com/ivf-2", "source_type": "api",
           "source_platform": "pubmed", "relevance_score": 85.0,
           "tags": json.dumps(["AI", "IVF"]), "tier": "01-Raw",
           "collected_at": "2026-07-16T10:00:00Z"},
      ]
      SYNTH = {
          "executive_summary": "IVF technology advanced with time-lapse imaging and AI selection.",
          "key_findings": [
              {"topic": "Time-lapse imaging", "detail": "Significant improvement in live birth rates."},
              {"topic": "AI embryo selection", "detail": "Promising but lacks prospective validation."},
          ],
          "recommendations": ["Support prospective AI validation trials."],
          "implications": ["Clinics should evaluate time-lapse imaging adoption."],
          "risks": [{"title": "Validation lag", "likelihood": "high", "impact": "medium",
                     "mitigation": "Run prospective trials."}],
          "action_required": ["Fund prospective AI validation trials."],
      }

      def tmpl(name):
          return next(r["template"] for r in PRODUCT_TEMPLATES if r["name"] == name)

      def grouping():
          return ExtractionResult(item_id="_g", title="Groups", custom_fields={
              "groups": [{"theme": "IVF & Reproductive Medicine", "description": "IVF advances.",
                          "entry_ids": ["e1"]}]})

      def summary():
          return ExtractionResult(item_id="_s", title="Executive Summary", custom_fields={
              "executive_summary": "IVF treatment continues to advance."})

      tmp = Path(tempfile.mkdtemp(prefix="regression-product-routing-c-"))
      old = os.getcwd()
      try:
          os.chdir(tmp)
          with patch("autoinfo.output.KBStore") as kb_cls, \
               patch("autoinfo.output._call_llm_for_digest", return_value=SYNTH):
              kb = MagicMock()
              kb.list_entries.return_value = ENTRIES
              kb_cls.return_value = kb
              premium = generate_digest(domain="medical-research", period="weekly",
                                        format="markdown",
                                        product_template=tmpl("premium-briefing"),
                                        include_stale=True)
              magazine = generate_digest(domain="general-news", period="weekly",
                                         format="markdown",
                                         product_template=tmpl("magazine-digest"),
                                         include_stale=True)
              standard_digest = generate_digest(domain="medical-research",
                                                period="weekly", format="markdown",
                                                include_stale=True)
          with patch("autoinfo.output.KBStore") as kb_cls, \
               patch("autoinfo.llm.LLMExtractor.extract",
                     side_effect=[grouping(), summary()]), \
               patch("autoinfo.output._call_llm_for_report_synthesis", return_value=""):
              kb = MagicMock()
              kb.list_entries.return_value = ENTRIES
              kb_cls.return_value = kb
              standard_report = generate_report(domain="medical-research", period="monthly",
                                                format="markdown", report_type="standard")
          for out in (premium, magazine, standard_digest, standard_report):
              assert isinstance(out, str), type(out)
          # premium vs magazine: no shared section anchors, each has its own.
          assert "## Key Takeaways" not in magazine, "magazine leaked premium sections"
          assert "## In This Issue" not in premium, "premium leaked magazine sections"
          # premium vs standard digest: standard digest.md.j2 anchors absent from premium.
          assert "## Entries" not in premium, "premium rendered standard digest layout"
          assert "## Key Takeaways" not in standard_digest, "standard digest rendered premium layout"
          # magazine vs standard report: report.md.j2 anchors absent from magazine.
          assert "## Sections" not in magazine, "magazine rendered report layout"
          assert "## In This Issue" not in standard_report, "standard report rendered magazine layout"
          # Standard outputs keep their own anchors.
          assert "## Entries" in standard_digest, "standard digest anchors missing"
          assert "# medical-research \u2014 Report" in standard_report, "standard report anchors missing"
          assert "## Sections" in standard_report, "standard report sections missing"
          print("PRODUCT_ROUTING_DISTINCT_OK")
      finally:
          os.chdir(old)
          shutil.rmtree(tmp, ignore_errors=True)
      '
    expect:
      success: true
      exit_code: 0
      stdout_has: ["PRODUCT_ROUTING_DISTINCT_OK"]
