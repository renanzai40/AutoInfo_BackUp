# Regression (#16): relevance/tags scoring must not leak as flat placeholders.
#
# History: G3RelevanceScoring returned `score=100 (always pass)` when a
# topic had no keywords, so every keywordless topic's entries stored
# `relevance_score=100.0` in the KB and every digest/magazine rendered
# `Relevance | 100.0/100` with zero discriminative power.  The no-keywords
# branch now degrades to `score=0, passed=False, flagged=True`, so real
# scores surface.  The G3 scoring behavior itself is guarded by
# tests/llm/test_quality.py (data layer); #85 (R2 metrics-leak, P0) later
# removed the per-entry Tags/Relevance rows from the digest templates, so
# this scenario guards the PRODUCT contract: real entries flow into the
# digest (title + summary render) and NO internal relevance/tags row leaks.
#
# Deterministic (requires_env: []): the KBStore and LLM seams are patched in
# the subprocess (same pattern as regression-9-generic-theme-blocklist.yaml).
# Two entries are supplied — one with `tags='["ai", "funding"]'` and
# relevance 70, one with `tags='[]'` and relevance 0.  The digest must render
# entry 1's title/summary (real data flowing through) and must NOT render any
# `Relevance | .../100` or `**Tags**` row (internal metrics removed by #85).
# Runs inside an ABSOLUTE temp cwd (tempfile.mkdtemp, try/finally cleanup).
name: regression-16-relevance-tags
description: "Regression #16: digest renders real entries with no flat 100.0/100 relevance leak and no internal Tags/Relevance row (#85)"
category: regression
regression: true
regression_issue: "#16"
requires_env: []
steps:
  - name: "digest renders real entries without leaking internal relevance/tags rows"
    kind: cli
    command: |-
      python3 -c '
      import json, os, shutil, tempfile
      from pathlib import Path
      from unittest.mock import MagicMock, patch
      from autoinfo.output import generate_digest

      ENTRIES = [
          {"entry_id": "e1", "title": "AI startup raises Series A",
           "summary": "A startup closed a funding round.",
           "source_url": "https://example.com/e1", "source_type": "api",
           "source_platform": "pubmed", "relevance_score": 70.0,
           "tags": "[\"ai\", \"funding\"]", "tier": "01-Raw",
           "collected_at": "2026-08-01T10:00:00Z"},
          {"entry_id": "e2", "title": "Unrelated filler item",
           "summary": "An item with no tags and zero relevance.",
           "source_url": "https://example.com/e2", "source_type": "api",
           "source_platform": "pubmed", "relevance_score": 0.0,
           "tags": "[]", "tier": "01-Raw",
           "collected_at": "2026-08-02T10:00:00Z"},
      ]

      def synthesis():
          return {"executive_summary": "Weekly digest of AI funding moves.",
                  "key_findings": [], "recommendations": []}

      tmp = Path(tempfile.mkdtemp(prefix="regression-16-relevance-tags-"))
      old = os.getcwd()
      try:
          os.chdir(tmp)
          with patch("autoinfo.output.KBStore") as kb_cls, \
               patch("autoinfo.output._call_llm_for_digest",
                     return_value=synthesis()):
              kb = MagicMock()
              kb.list_entries.return_value = ENTRIES
              kb_cls.return_value = kb
              out = generate_digest(domain="medical-research",
                                    period="weekly", format="markdown",
                                    include_stale=True)
          assert isinstance(out, str), type(out)
          # Real entries flow through: titles + summaries render.
          assert "AI startup raises Series A" in out, out
          assert "Unrelated filler item" in out, out
          # #85 (R2 metrics-leak): no per-entry Tags/Relevance rows at all.
          assert "**Tags**" not in out, "internal Tags row leaked:\n" + out
          # No flat 100.0/100 placeholder may leak (the #16 pre-fix bug).
          assert "100.0/100" not in out, "flat 100.0/100 placeholder leaked:\n" + out
          assert "| 70.0/100" not in out, "internal Relevance row leaked:\n" + out
          print("RELEVANCE_TAGS_OK")
      finally:
          os.chdir(old)
          shutil.rmtree(tmp, ignore_errors=True)
      '
    expect:
      success: true
      exit_code: 0
      stdout_has: ["RELEVANCE_TAGS_OK"]
