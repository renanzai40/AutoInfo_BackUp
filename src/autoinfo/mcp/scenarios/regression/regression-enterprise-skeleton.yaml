# Regression #314 (placeholder extension): enterprise-briefing rendered output
# must not contain LLM skeleton placeholders (<finding 1>, <metric> | <value>
# | <source>, etc.) echoed verbatim from the prompt template.
#
# The D1 gate's _is_empty_placeholder now catches <...> skeleton tokens.
# This scenario renders the real generate_report path with a mocked LLM
# that deliberately returns skeleton text, and asserts the output either
# strips the placeholders or treats the section as empty.
#
# Deterministic (requires_env: []): KBStore and _call_llm_for_report_synthesis
# are patched.
name: regression-enterprise-skeleton
description: "Regression #314: enterprise-briefing output must not contain <...> skeleton placeholders"
category: regression
regression: true
regression_issue: "#314"
requires_env: []
steps:
  - name: "enterprise-briefing report rejects skeleton placeholders"
    kind: cli
    command: |-
      python3 -c '
      import json, os, re, shutil, tempfile
      from pathlib import Path
      from unittest.mock import MagicMock, patch
      from autoinfo.output import PRODUCT_TEMPLATES, generate_report

      ENTRIES = [
          {"entry_id": f"e{i}", "title": f"Study {i}",
           "summary": f"Finding {i}.",
           "source_url": f"https://example.com/{i}",
           "source_type": "api", "source_platform": "pubmed",
           "relevance_score": 90 - i,
           "tags": json.dumps(["medical"]), "tier": "01-Raw",
           "collected_at": "2026-07-15T10:00:00Z"}
          for i in range(1, 6)
      ]

      # LLM deliberately returns skeleton placeholders — the prompt echo
      SKELETON_MD = """## Executive Summary
      This briefing details <finding 1> selected items.

      ## Key Findings
      - <finding 1>: <2-3 paragraphs>
      - <finding 2>: <2-3 paragraphs>
      - <finding 3>: <2-3 paragraphs>

      ## Implications
      - <implication for finding 1>
      - <implication for finding 2>

      ## Risks & Opportunities
      - <risk title> | <likelihood> | <impact> | <mitigation>

      ## Action Required
      - <action for finding 1>

      ## Key Metrics
      - <metric> | <value> | <source>

      ## Recommendations
      - <recommendation 1>
      """

      def tmpl(name):
          return next(r["template"] for r in PRODUCT_TEMPLATES if r["name"] == name)

      tmp = Path(tempfile.mkdtemp(prefix="regression-skeleton-"))
      old = os.getcwd()
      try:
          os.chdir(tmp)
          with patch("autoinfo.output.KBStore") as kb_cls, \
               patch("autoinfo.llm.LLMExtractor.extract", return_value=None), \
               patch("autoinfo.output._call_llm_for_report_synthesis",
                     return_value=SKELETON_MD):
              kb = MagicMock()
              kb.list_entries.return_value = ENTRIES
              kb_cls.return_value = kb
              out = generate_report(domain="medical-research", period="weekly",
                                    format="markdown",
                                    product_template=tmpl("enterprise-briefing"))
          assert isinstance(out, str), type(out)
          # The skeleton placeholders must NOT appear in the rendered output
          skeleton_matches = re.findall(r"<[a-z0-9 _\-]+>", out, re.IGNORECASE)
          # Allow angle brackets in the scope label (e.g. none expected)
          # but reject typical placeholder patterns
          bad = [m for m in skeleton_matches
                 if re.match(r"<(finding|implication|risk|action|metric|recommendation|source|detail|paragraph)", m, re.IGNORECASE)]
          assert len(bad) == 0, f"Skeleton placeholders found in output: {bad}\nOutput:\n{out}"
          print("ENTERPRISE_SKELETON_OK")
      finally:
          os.chdir(old)
          shutil.rmtree(tmp, ignore_errors=True)
      '
    expect:
      success: true
      exit_code: 0
      stdout_has: ["ENTERPRISE_SKELETON_OK"]
