# Regression #294: products rendered "No content provided" / blank summary
# cells for KB entries whose summary is empty or an LLM placeholder string.
# Fix: `_is_empty_summary` (blank / "No content provided to summarize." /
# "n/a" / "no summary" / "no content") feeds `_is_test_entry`, so
# `_filter_product_entries` drops empty-summary entries BEFORE synthesis and
# BEFORE render; the `product_summary` Jinja filter additionally renders "—"
# for any empty summary that slips through (defense-in-depth).
#
# This scenario drives the real generators with a mocked KBStore + mocked LLM
# (deterministic, no network/LLM key).  A regression that stops filtering
# fails here: the rendered digest/report must contain the real entry and must
# NOT contain "No content provided" or the empty-summary entry.
name: regression-294-empty-summary
description: "Regression #294: digest/report never render 'No content provided' or blank summary cells"
category: regression
regression: true
regression_issue: "#294"
requires_env: []
steps:
  - name: "digest excludes the empty-summary entry and never renders the placeholder"
    kind: cli
    command: |-
      python3 -c '
      from datetime import date, timedelta
      from unittest.mock import MagicMock, patch
      from autoinfo.output import generate_digest

      real = {
          "entry_id": "real-001",
          "title": "IVF time-lapse imaging improves live birth rates",
          "domain": "medical-research",
          "tier": "01-Raw",
          "source_url": "https://pubmed.ncbi.nlm.nih.gov/12345678/",
          "source_type": "api",
          "source_platform": "pubmed",
          "collected_at": (date.today() - timedelta(days=1)).isoformat(),
          "summary": "Time-lapse imaging improves live birth rates (48.2% vs 39.5%).",
          "tags": "[]",
          "quality_tier": 1,
          "relevance_score": 92.0,
      }
      empty_entry = {
          "entry_id": "empty-001",
          "title": "Empty summary entry",
          "domain": "medical-research",
          "tier": "01-Raw",
          "source_url": "https://pubmed.ncbi.nlm.nih.gov/99999999/",
          "source_type": "api",
          "source_platform": "pubmed",
          "collected_at": (date.today() - timedelta(days=1)).isoformat(),
          "summary": "No content provided to summarize.",
          "tags": "[]",
          "relevance_score": 50.0,
      }
      synthesis = {
          "executive_summary": "This week IVF technology advanced on time-lapse imaging.",
          "key_findings": [
              {"topic": "Time-lapse imaging", "detail": "Improves live birth rates."}
          ],
          "trends": ["Growing adoption."],
          "recommendations": ["Expand access."],
      }

      with patch("autoinfo.output.KBStore") as mock_kb, \
              patch("autoinfo.output._call_llm_for_digest", return_value=synthesis), \
              patch("autoinfo.output._fire_agent_notification"):
          mock_store = MagicMock()
          mock_store.list_entries.return_value = [real, empty_entry]
          mock_kb.return_value = mock_store
          result = generate_digest(domain="medical-research", period="weekly", format="markdown")

      assert isinstance(result, str), type(result)
      assert "No content provided" not in result, "placeholder summary leaked into digest"
      assert "Empty summary entry" not in result, "empty-summary entry leaked into digest"
      assert "IVF time-lapse imaging improves live birth rates" in result, "real entry missing"
      print("DIGEST_EMPTY_SUMMARY_OK")
      '
    expect:
      success: true
      exit_code: 0
      stdout_has: ["DIGEST_EMPTY_SUMMARY_OK"]

  - name: "report excludes the empty-summary entry and never renders the placeholder"
    kind: cli
    command: |-
      python3 -c '
      from datetime import date, timedelta
      from unittest.mock import MagicMock, patch
      from autoinfo.output import generate_report

      real = {
          "entry_id": "real-001",
          "title": "IVF time-lapse imaging improves live birth rates",
          "domain": "medical-research",
          "tier": "01-Raw",
          "source_url": "https://pubmed.ncbi.nlm.nih.gov/12345678/",
          "source_type": "api",
          "source_platform": "pubmed",
          "collected_at": (date.today() - timedelta(days=1)).isoformat(),
          "summary": "Time-lapse imaging improves live birth rates (48.2% vs 39.5%).",
          "tags": "[]",
          "quality_tier": 1,
          "relevance_score": 92.0,
      }
      empty_entry = {
          "entry_id": "empty-001",
          "title": "Empty summary entry",
          "domain": "medical-research",
          "tier": "01-Raw",
          "source_url": "https://pubmed.ncbi.nlm.nih.gov/99999999/",
          "source_type": "api",
          "source_platform": "pubmed",
          "collected_at": (date.today() - timedelta(days=1)).isoformat(),
          "summary": "No content provided to summarize.",
          "tags": "[]",
          "relevance_score": 50.0,
      }

      with patch("autoinfo.output.KBStore") as mock_kb, \
              patch("autoinfo.output._group_by_theme") as mock_group, \
              patch("autoinfo.output._generate_executive_summary") as mock_synth, \
              patch("autoinfo.output._fire_agent_notification"):
          mock_store = MagicMock()
          mock_store.list_entries.return_value = [real, empty_entry]
          mock_kb.return_value = mock_store
          mock_group.return_value = [
              {"theme": "General", "description": "All", "entries": [real]}
          ]
          mock_synth.return_value = {
              "executive_summary": "Summary.",
              "key_findings": [{"text": "Finding"}],
              "recommendations": ["Rec"],
          }
          result = generate_report(domain="medical-research", period="weekly", format="markdown")

      assert isinstance(result, str), type(result)
      assert "No content provided" not in result, "placeholder summary leaked into report"
      assert "Empty summary entry" not in result, "empty-summary entry leaked into report"
      assert "IVF time-lapse imaging improves live birth rates" in result, "real entry missing"
      print("REPORT_EMPTY_SUMMARY_OK")
      '
    expect:
      success: true
      exit_code: 0
      stdout_has: ["REPORT_EMPTY_SUMMARY_OK"]