  - name: "demo-seed fallback returns exclude_keywords when runtime config lacks the key"
    kind: cli
    command: |-
      python3 -c '
      import os, shutil, tempfile
      from pathlib import Path
      import yaml
      from autoinfo.output import _get_domain_exclude_keywords

      tmp = Path(tempfile.mkdtemp(prefix="regression-319-seed-"))
      old = os.getcwd()
      try:
          cfg_dir = tmp / ".autoinfo"
          cfg_dir.mkdir(parents=True)
          cfg = {"project": {"name": "test"},
                 "llm": {"provider": "openai", "model": "deepseek-v4-flash"},
                 "domains": [{"name": "ai-commercial", "active": True,
                              "sources": [{"name": "techcrunch", "type": "rss",
                                           "url": "https://techcrunch.com/feed/"}],
                              "topics": []}]}
          (cfg_dir / "config.yaml").write_text(
              yaml.safe_dump(cfg, allow_unicode=True, sort_keys=False),
              encoding="utf-8")
          os.chdir(tmp)
          v = _get_domain_exclude_keywords("ai-commercial")
          assert v == ["贝达药业", "DURAVYU"], f"seed fallback wrong: {v}"
          print("SEED_FALLBACK_OK")
      finally:
          os.chdir(old)
          shutil.rmtree(tmp, ignore_errors=True)
      '
    expect:
      success: true
      exit_code: 0
      stdout_has: ["SEED_FALLBACK_OK"]
