# Regression #336: `validate diff` statistics reconcile with the failure
# count the cards actually contain.
#
# Before the fix, `diff_report_cards` indexed ONLY per-assertion pass/fail.
# A product that turned `missing` or `error` (status != ok, assertions [])
# contributed no index entries, so it was silently dropped from every diff
# bucket — the printed new/regressed/existing counts under-counted the real
# failures and forced the reader to hand-count the JSON.
#
# The fix adds the `(product, PRODUCT_STATUS)` pseudo-assertion so missing /
# error products are first-class diff items, plus `card_issue_counts` /
# summary breakdown so the identity
#   cur issues == new + regressed + existing_failing
# holds and is printed by the CLI.
#
# Deterministic (requires_env: []): exercises diff_report_cards directly.
name: regression-validation-diff-reconciliation
description: "Regression #336: diff buckets include missing/error products and reconcile with the card failure count"
category: regression
regression: true
regression_issue: "#336"
requires_env: []
steps:
  - name: "diff counts reconcile with hand-counted cur failures"
    kind: cli
    command: |-
      python3 -c '
      from autoinfo.validation_matrix import (
          MatrixReport, PRODUCT_STATUS, card_issue_counts, diff_report_cards,
      )

      def card(products, batch):
          m = MatrixReport(generated_at="t", commit="abc", batch_id=batch)
          m.products = products
          return m.to_dict()

      def row(product, status, assertions, **extra):
          return {"domain": "d", "product": product, "status": status,
                  "assertions": assertions, **extra}

      prev = card([
          row("a", "ok", [{"assertion": "_not_empty", "passed": True}]),
          row("b", "ok", [{"assertion": "_not_empty", "passed": True}]),
          row("c", "ok", [{"assertion": "_not_empty", "passed": True}]),
      ], "prev-1")
      cur = card([
          row("a", "ok", [{"assertion": "_not_empty", "passed": False}]),
          row("b", "missing", []),
          row("c", "ok", [{"assertion": "_not_empty", "passed": True}]),
          row("d", "error", [], error="boom"),
      ], "cur-1")

      d = diff_report_cards(prev, cur)
      c = d["counts"]
      cur_counts = card_issue_counts(cur)
      cur_issues = (
          cur_counts["failing_assertions"]
          + cur_counts["missing_products"]
          + cur_counts["error_products"]
      )
      reconciled = c["new"] + c["regressed"] + c["existing_failing"]
      assert cur_issues == 3, cur_counts
      assert reconciled == cur_issues, (c, cur_counts)
      assert c == {"new": 1, "regressed": 2, "fixed": 0, "existing_failing": 0}
      assert ("d", "b", PRODUCT_STATUS) in d["regressed"]
      assert ("d", "d", PRODUCT_STATUS) in d["new"]
      print("VALIDATION_DIFF_RECONCILIATION_OK")
      '
    expect:
      success: true
      exit_code: 0
      stdout_has: ["VALIDATION_DIFF_RECONCILIATION_OK"]
