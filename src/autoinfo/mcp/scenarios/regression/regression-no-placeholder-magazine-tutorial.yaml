    expect:
      success: true
      exit_code: 0
      stdout_has: ["NO_PLACEHOLDER_TUTORIAL_EMPTY_LLM_OK"]

  - name: "zero-entry paths render neutral prose, never a placeholder"
    kind: cli
    command: |-
      python3 -c '
      import os, shutil, tempfile
      from pathlib import Path
      from unittest.mock import MagicMock, patch
      from autoinfo.output import generate_tutorial

      tmp = Path(tempfile.mkdtemp(prefix="regression-342-d-"))
      old = os.getcwd()
      try:
          os.chdir(tmp)
          with patch("autoinfo.output.KBStore") as kb_cls:
              kb = MagicMock()
              kb.list_entries.return_value = []
              kb_cls.return_value = kb
              out = generate_tutorial(domain="ai-commercial", format="markdown")
          assert isinstance(out, str), type(out)
          assert "No knowledge base entr" not in out, "empty-state marker present"
          assert "_No " not in out, "placeholder present"
          assert "This edition has no curated items yet" in out, "neutral prose missing"
          print("NO_PLACEHOLDER_ZERO_ENTRY_OK")
      finally:
          os.chdir(old)
          shutil.rmtree(tmp, ignore_errors=True)
      '
    expect:
      success: true
      exit_code: 0
      stdout_has: ["NO_PLACEHOLDER_ZERO_ENTRY_OK"]