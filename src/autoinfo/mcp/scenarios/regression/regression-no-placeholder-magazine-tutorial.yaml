           "summary": f"Startup {i} raised $20M.",
           "source_url": f"https://techcrunch.com/{i}",
           "source_type": "rss", "source_platform": "techcrunch",
           "relevance_score": 90 - i, "tags": "[]",
           "tier": "01-Raw", "collected_at": "2026-07-15T10:00:00Z"}
          for i in range(1, 4)
      ]

      tmp = Path(tempfile.mkdtemp(prefix="regression-342-c-"))
