      import json, os, shutil, tempfile
      from pathlib import Path
      from unittest.mock import patch

      from autoinfo.validation_matrix import SkipPolicy, run_matrix

      CLEAN = (
          "# AI Commercial Report\n\n"
          "**Domain**: ai-commercial\n"
          "**Sections**: 2\n\n"
          "## Summary\n\n"
