              "generated_at": generated_at,
              "commit": "c" + bid[1:],
              "batch_id": bid,
              "products": [{
                  "domain": "ai-commercial", "product": "report", "status": "ok",
                  "assertions": [{"assertion": "_not_empty", "passed": True}],
              }],
              "summary": {"raw_counts": {"ai-commercial": 5}},
          }

      old = os.getcwd()
      tmp = tempfile.mkdtemp(prefix="regression-348-c-")
      try:
          os.chdir(tmp)
          snap = Path("snap")
          for bid, stamp, ts in [("b1", "1", "2026-08-01T00:00:00Z"),
                                 ("b2", "2", "2026-08-02T00:00:00Z"),
                                 ("b3", "3", "2026-08-03T00:00:00Z")]:
              bdir = snap / bid
              bdir.mkdir(parents=True, exist_ok=True)
              (bdir / ("report-card-c%s-%s.json" % (bid[1:], stamp))).write_text(
                  json.dumps(card(bid, stamp, ts)), encoding="utf-8")
          art = snap / "b3" / "products" / "ai-commercial" / "report-markdown-b3.md"
          art.parent.mkdir(parents=True, exist_ok=True)
          art.write_text(CLEAN, encoding="utf-8")

          with patch("autoinfo.validation_matrix._generate_product",
                     return_value=CLEAN) as gen, \
               patch("autoinfo.validation_matrix._current_commit", return_value="c4"):
              report = run_matrix(
                  ["ai-commercial"], ["report"], only_assert=False,
                  batch_id="b4", artifacts_dir=snap,
                  skip=SkipPolicy(allow_skip=False),
              )
          # allow_skip=False mirrors `validate matrix --no-skip`: history is
          # never consulted, every pair is regenerated, no frozen row.
          assert gen.called
          row = next(p for p in report.products if p["product"] == "report")
          assert row["status"] == "ok"
          assert "frozen" not in row
          assert report.summary["skipped_products"] == []
          print("SMART_SKIP_NO_SKIP_OK")
      finally:
          os.chdir(old)
          shutil.rmtree(tmp, ignore_errors=True)
      '
    expect:
      success: true
      exit_code: 0
      stdout_has: ["SMART_SKIP_NO_SKIP_OK"]

