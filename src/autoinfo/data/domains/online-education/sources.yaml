extract_fields:
  - name: course_title
    type: string
    description: "Title of the course or program mentioned"
    required: true
  - name: provider
    type: string
    description: "Platform or institution providing the course (e.g. Coursera, edX, Khan Academy)"
    required: true
  - name: difficulty
    type: string
    description: "Difficulty level: beginner, intermediate, advanced, or all-levels"
    required: false
  - name: duration
    type: string
    description: "Estimated duration to complete (e.g. 4 weeks, 3 months, self-paced)"
    required: false
  - name: topics
    type: array
    description: "List of subject areas covered by the course"
    required: false
  - name: rating
    type: string
    description: "User or community rating if available (e.g. 4.5/5)"
    required: false
