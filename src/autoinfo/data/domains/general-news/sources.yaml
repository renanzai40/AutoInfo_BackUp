topics:
- name: World News
  keywords:
  - world news
  - international
  - global
  - geopolitics
  - foreign affairs
  - United Nations
  - summit
  - diplomatic
- name: Politics
  keywords:
  - politics
  - election
  - government
  - parliament
  - congress
  - policy
  - legislation
  - administration
- name: Breaking News
  keywords:
  - breaking
  - update
  - live
  - developing story
  - emergency
  - crisis
  - latest
  - just in
default_language: en
exclude_keywords:
- entertainment gossip
- sports highlights
- advertising campaigns
- celebrity
