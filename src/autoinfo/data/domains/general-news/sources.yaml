name: general-news
description: General news intelligence — global headlines, world events, politics,
  breaking news
sources:
- name: gdelt
  type: gdelt
  url: https://api.gdeltproject.org/api/v2/doc/doc
  quality_tier: 2
  enabled: false
  tos_classification: open
  rate_limit: 1
  fetch_depth: abstract
  settings:
    query: ''
    timespan: 7d
    maxrecords: 25
- name: guardian-open-platform
  type: api
  url: https://content.guardianapis.com/search
  quality_tier: 1
  enabled: true
  tos_classification: open
  requires_key: true
  rate_limit: 5
  fetch_depth: abstract
  settings:
    query_param: q
    json_path: response.results
    page_size: 20
    max_pages: 1
    field_mapping:
      id: id
      title: webTitle
      content: fields.bodyText
      source_url: webUrl
      published_date: webPublicationDate
- name: google-news-rss
  type: rss
  url: https://news.google.com/rss
  quality_tier: 2
  enabled: false
  tos_classification: open
  rate_limit: 10
  fetch_depth: abstract
- name: nyt
  type: nyt
  url: https://api.nytimes.com/svc/search/v2/articlesearch.json
  quality_tier: 1
  enabled: false
  tos_classification: licensed
  requires_key: true
  rate_limit: 10
  fetch_depth: abstract
  settings:
    query: ''
    sort: newest
- name: ap-api
  type: ap_api
  url: https://api.ap.org/v2/
  quality_tier: 1
  enabled: true
  tos_classification: licensed
  requires_key: true
  rate_limit: 20
  fetch_depth: fulltext
- name: zhihu-daily
  type: api
  url: https://news-at.zhihu.com/api/4/news/latest
  quality_tier: 1
  enabled: true
  tos_classification: open
  rate_limit: 10
  fetch_depth: abstract
  settings:
    json_path: stories
    field_mapping:
      id: id
      title: title
      source_url: url
- name: mastodon
  type: api
  url: https://mastodon.social/api/v1/timelines/public
  quality_tier: 2
  enabled: false
  tos_classification: open
  rate_limit: 1
  fetch_depth: abstract
  settings:
    json_path: $
    field_mapping:
      id: id
      content: content
      source_url: url
      published_date: created_at
- name: bluesky
  type: api
  url: https://public.api.bsky.app/xrpc/app.bsky.feed.searchPosts
  quality_tier: 2
  enabled: false
  tos_classification: open
  rate_limit: 10
  fetch_depth: abstract
  settings:
    query_param: q
    json_path: posts
    field_mapping:
      id: cid
      content: record.text
      source_url: uri
      published_date: indexedAt
- name: wechat2rss
  type: rss
  url: https://wechat2rss.xlab.app/feed/{id}.xml
  quality_tier: 2
  enabled: true
  tos_classification: open
  requires_key: false
  rate_limit: 10
  fetch_depth: abstract
  settings:
    instance: wechat2rss.xlab.app — public third-party RSS service for WeChat official
      accounts (公众号)
    feed_id: <replace-me>
- name: medium-user
  type: rss
  url: https://medium.com/feed/@user
  quality_tier: 2
  enabled: false
  tos_classification: open
  rate_limit: 10
  fetch_depth: abstract
- name: medium-publication
