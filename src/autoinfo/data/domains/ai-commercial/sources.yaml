# AutoInfo demo domain: AI Commercial Intelligence
# Tracks AI startup funding, product launches, and industry trends
name: ai-commercial
description: "AI commercial intelligence — startup funding, product launches, industry trends"
# Issue #317: 3 of 4 sources are English (TechCrunch/ProductHunt/Crunchbase);
# 36KR is Chinese.  Default the output language to English so products come out
# single-language without an explicit --language param.
default_language: en
# Issue #166: exclude low-signal entries below this stored relevance score
# from product aggregation.  0 disables; entries without a score pass.
min_product_relevance: 30

# Cross-domain noise filter (#319): entries whose title/summary/tags contain
# any of these keywords are excluded from product generation (digest/report)
# BEFORE LLM synthesis.  The set mirrors the validation-matrix noise contract
# (_AI_COMMERCIAL_NOISE in validation_matrix.py): the specific entities from
# issue #319 (贝达药业, DURAVYU) plus the financial/regulatory noise terms
# (华能, 株冶, 平安好医生, SEC 8-K, 10-Q, 财报, 年报) that leak from
# cross-domain collection.  Deliberately NOT broad medical terms like 医药/临床
# trial, which legitimately appear in AI-commercial content (e.g. "AI drug
# discovery", "AI clinical trials").
#
# Issue #18: real ai-commercial products also mixed in non-AI-consumer
# ENGLISH entries — Peacock streaming price hike (streaming), Fairphone
# repairable smartphone (consumer hardware), Einride 500 Tesla electric trucks
# (EV/fleet), Plask Apple-Watch dive-depth app (unrelated app), Grounded truck
# custom mods, Neko Health body-scan clinic.  The terms below block those
# drift entities + their broad categories.  Matching is a casefold substring
# over title/summary/tags, so lowercase tokens cover Peacock/FAIRPHONE/...
# Deliberately NOT generic AI-legitimate terms (AI, startup, funding, model,
# app alone), which legitimately appear in AI-commercial content.
exclude_keywords:
  # Issue #319: Chinese financial/regulatory noise
  - 贝达药业
  - DURAVYU
  - 华能
  - 株冶
  - 平安好医生
  - SEC 8-K
  - 10-Q
  - 财报
  - 年报
  # Issue #18: English non-AI-consumer topic drift
  - peacock
  - streaming service
  - streaming
  - fairphone
  - smartphone
  - einride
  - electric truck
  - truck
  - plask
  - dive app
  - dive
  - grounded
  - game mod
  - body scan
  - clinic

sources:
  - name: techcrunch
    type: rss
    url: https://techcrunch.com/feed/
    quality_tier: 2
    frequency: hourly
    access: free
    rate_limit: 10

  - name: producthunt
    type: rss
    url: https://www.producthunt.com/feed
    quality_tier: 2
    frequency: daily
    access: free
    rate_limit: 10

  - name: Crunchbase
    type: rss
    url: https://news.crunchbase.com/feed/
    quality_tier: 2
    enabled: true

  - name: 36kr
    type: rss
    enabled: true
    url: "https://www.36kr.com/feed"
    quality_tier: 2
    settings:
      feed_url: "https://www.36kr.com/feed"
      rate_limit_per_second: 1
    field_mapping:
      id: id
      title: title
      content: content
      source_url: link
      published_date: updated
    topics:
      - Chinese tech
      - startup

topics:
  - name: "AI Startup Funding"
    keywords:
      - AI startup
      - artificial intelligence
      - funding
      - series A
      - venture capital
      - seed round
  - name: "AI Product Launches"
    keywords:
      - AI product
      - launch
      - LLM
      - GPT
      - generative AI
      - machine learning
      # Issue #9: curated English keywords for the deterministic grouping
      # seed — merged into _load_keyword_topics so English-titled ai-commercial
      # entries group under meaningful themes instead of generic labels.
      - model release
      - regulation
      - benchmark
