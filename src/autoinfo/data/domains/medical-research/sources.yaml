# AutoInfo demo domain: Medical Research
# Tracks academic papers in 辅助生殖/脑科学/神经科学
name: medical-research
description: "Medical research tracking — 辅助生殖/脑科学/神经科学"

sources:
  - name: pubmed
    type: api
    url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/
    quality_tier: 1
    frequency: daily
    access: free
    rate_limit: 3  # requests per second without API key
    fetch_depth: fulltext  # PMC full-text via idconv+efetch when available

  - name: semantic-scholar
    type: api
    url: https://api.semanticscholar.org/graph/v1
    quality_tier: 1
    frequency: daily
    access: free
    rate_limit: 1  # requests per second without API key (100 req/s with key)
    api_key_optional: true
    enabled: true

  - name: arXiv
    type: rss
    url: https://rss.arxiv.org/rss/q-bio
    quality_tier: 2
    enabled: true
    rate_limit: 10

  - name: CrossRef
    type: api
    url: https://api.crossref.org/works
    quality_tier: 2
    enabled: true
    rate_limit: 50
    api_key_optional: true
    settings:
      query_param: query
      json_path: message.items
      field_mapping:
        id: DOI
        title: "title[0]"
        source_url: URL
        content: abstract

  - name: dblp
    type: dblp
    url: https://dblp.org/search/publ/api
    enabled: true
    quality_tier: 1
    rate_limit: 1
    settings:
      query: ""

  - name: openalex
    type: openalex
    url: https://api.openalex.org/works
    enabled: true
    quality_tier: 1
    rate_limit: 10
    settings:
      query: ""
      rate_limit_per_second: 10
    field_mapping:
      id: id
      title: title
      content: abstract
      authors: authors
      published_date: publication_date
    topics: []

  - name: uspto
    type: api
    url: https://api.patentsview.org/patents/query
    quality_tier: 1
    frequency: daily
    access: free
    rate_limit: 5  # requests per second without API key (45 req/s with key)
    api_key_optional: true
    enabled: true
    fallback_rss: https://www.uspto.gov/feeds/patent_application.xml

default_language: en
# Issue #166: exclude entries below this stored relevance score from PRODUCT
# aggregation (horse RCTs, non-reproductive clinical guidelines that pass the
# substring blacklist).  0 disables; entries without a score pass (fail-open).
min_product_relevance: 30

exclude_keywords:
  # Domain-noise blacklist (issue #19): filter out-of-domain / weakly-related
  # signals from product generation — pure psychology/pediatrics general
  # articles and generic biology overviews unrelated to medical research.
  - pediatrics
  - pediatric care
  - child development
  - parenting
  - school psychology
  - counseling
  - psychotherapy
  - ecology
  - zoology
  - plant biology
  - marine biology
  - evolutionary biology
  # Non-reproductive-domain exclusions (issue #136): broad-keyword
  # collection pulls oncology, animal-experiment, and non-reproductive
  # clinical items (cervical cancer / chemoradiotherapy, guinea pig /
  # equine experiments, intravenous-fluid guidelines) that dilute the
  # IVF/ART focus.  These are out-of-domain, not edited into the KB.
  - cervical cancer
  - oncology
  - chemoradiotherapy
  - guinea pig
  - equine
  - intravenous fluid
  - IV fluid
  - fluid guideline

topics:
  - name: "IVF & Assisted Reproduction"
    keywords:
      - IVF
      - embryo transfer
      - implantation
      - in vitro fertilization
      - assisted reproduction
      - ART
  - name: "Endometrium & Ovarian Reserve"
    keywords:
      - endometriosis
      - endometrium
      - ovarian reserve
      - AMH
      - anti-Müllerian hormone
      - follicle
      - ovulation
      - intralipid
  - name: "Male Infertility"
    keywords:
      - male infertility
      - sperm
      - semen
      - azoospermia
      - testosterone
      - spermatogenesis
  - name: "Embryology & Pregnancy Outcomes"
    keywords:
      - embryo
      - oocyte
      - vitrification
      - blastocyst
      - pregnancy outcome
      - miscarriage
      - live birth rate
      - euploidy
  - name: "Neuroplasticity & Cognition"
    keywords:
      - neuroplasticity
      - synaptic plasticity
      - long-term potentiation
      - cognitive function
      - memory
      - learning
      - neurogenesis
  - name: "Neuropsychiatry & Neurology"
    keywords:
      - neurodegeneration
      - dementia
      - Alzheimer
      - Parkinson
      - stroke
      - depression
      - anxiety
      - brain stimulation
