# AutoInfo demo domain: Financial/Business Intelligence
# Tracks market data, economic indicators, corporate filings, and financial news
name: financial-intelligence
description: "Financial and business intelligence — market data, economic indicators, corporate filings"

# SEC-filing dilution filter (#332): SEC EDGAR 8-K/10-K/10-Q items are
# metadata-only filings (form + company + date) whose titles and summaries
# carry the bare form id.  Excluding them from product input keeps the
# financial digest/report focused on substantive analysis instead of a list
# of filing notices.  The collection-time guard already drops NEW SEC items
# (collect.py _DOMAIN_NOISE_KEYWORDS); this seed filter also protects against
# stale pre-fix KB entries and re-processed caches.
exclude_keywords:
  # SEC-filing dilution filter (#332): SEC EDGAR 8-K/10-K/10-Q items are
  # metadata-only filings (form + company + date) whose titles and summaries
  # carry the bare form id.  Excluding them from product input keeps the
  # financial digest/report focused on substantive analysis instead of a list
  # of filing notices.  The collection-time guard already drops NEW SEC items
  # (collect.py _DOMAIN_NOISE_KEYWORDS); this seed filter also protects against
  # stale pre-fix KB entries and re-processed caches.
  - 8-K
  - 10-K
  - 10-Q
  - 10Q
  - SEC 8-K
  - 8-K filing
  - 10-K filing
  - 10-Q filing
  - SEC filing
  - SEC EDGAR
  - Form 8-K
  # Commodities / housing macro spam (issue #20): macro series that spam the
  # KB (crude/gold price ticks, mortgage-rate roundups) are out-of-domain for
  # financial-intelligence products focused on equities/corporates/policy.
  - crude oil prices
  - oil price
  - gold price
  - commodity prices
  - mortgage rates
  - housing market
  - home prices
  - real estate market
  - housing starts
  # Deal clickbait (issue #20): generic "3 stocks to buy" / hype headlines
  # without substantive analysis dilute product information density.
  - stocks to buy
  - stocks to watch
  - buy now
  - hot stocks
  - market recap
  # Shopping-deals dilution (issue #135, refined by #137): TheStreet /deals/
  # /shopping/ feed sections carry consumer retail deals (comforter /
  # dinnerware / sneakers / mattress markdowns) out-of-domain for financial
  # products.  The collection-time guard (collect.py
  # _DOMAIN_NOISE_URL_SUBSTRINGS) skips those URL paths.  At product time we
  # keep ONLY shopping-feature words — never standalone brand names
  # (walmart/amazon/macy), which would wrongly drop legitimate company news
  # (FTC suits, earnings, strategy) that merely mentions a brand (#137).
  - comforter
  - dinnerware
  - sneakers
  - mattress
  - on sale
  - is on sale
  - "% off"
  - deal of the day

# Effective-source set (issue #20): production runs on the 3 keyless RSS feed
# sources (CNBC Investing / TheStreet / MarketWatch Markets) + SEC EDGAR
# (free, ToS-compliant UA) + World Bank Data.  The API-key sources below
# (Alpha Vantage/FRED/Finnhub/Twelve Data/Quandl) stay configured as the demo
# template but are requires_key: true; without env keys they surface as
# SourceFailure at collect and are excluded from the effective set.
default_language: en

sources:
  - name: Alpha Vantage
    type: api
    url: https://www.alphavantage.co/query
    quality_tier: 1
    frequency: daily
    access: api_key
    requires_key: true
    rate_limit: 5  # requests per minute

  - name: FRED
    type: api
    url: https://api.stlouisfed.org/fred/series/observations
    quality_tier: 1
    frequency: daily
    access: api_key
    auth_mode: query
    params: {file_type: json, series_id: GDP}
    requires_key: true
    rate_limit: 120  # requests per minute

  - name: Finnhub
    type: api
    url: https://finnhub.io/api/v1/company-news?symbol=AAPL
    quality_tier: 2
    enabled: true
    tos_classification: licensed
    fetch_depth: abstract
    frequency: daily
    access: api_key
    requires_key: true
    settings:
      api_key: "${FINNHUB_API_KEY}"  # env-ref, resolved at config load (config.py _resolve_env_vars)
      auth_mode: query
      params:
        token: "${FINNHUB_API_KEY}"  # Finnhub contract: key travels in the `token` query param
      query_param: symbol
      json_path: "$"  # company-news returns a top-level JSON array
      rate_limit: 1  # requests per second (~60/min free tier)
      field_mapping:
        id: id
        title: headline
        content: summary
        source_url: url

  - name: SEC EDGAR
    type: sec_edgar
    url: https://www.sec.gov/edgar/browse/?action=getcompany
    quality_tier: 1
    enabled: true
    tos_classification: open
    fetch_depth: abstract
    frequency: daily
    access: free
    settings:
      tickers: "AAPL,MSFT,GOOGL"  # comma-separated string — SecEdgarHandler contract (M2T20), NOT a YAML list
      forms: "8-K,10-K,10-Q"  # SEC form allowlist — SecEdgarHandler `forms` config key (#332-B)
      user_agent: "AutoInfoResearch/1.0 (contact: ops@autoinfo.ai)"  # SEC requires an identifying UA; override per install
      rate_limit: 0.1  # seconds between requests — ≤10 req/s per SEC fair-access policy

  - name: Twelve Data
    type: api
    url: https://api.twelvedata.com/quote
    quality_tier: 2
    frequency: hourly
    access: api_key
    requires_key: true
    rate_limit: 8  # requests per minute (free tier)
    params: {apikey: YOUR_TWELVEDATA_KEY}
    field_mapping: {id: symbol, title: name, content: name, source_url: ''}

  - name: World Bank Data
    type: api
    url: https://api.worldbank.org/v2/country/USA/indicator/NY.GDP.MKTP.CD
    quality_tier: 2
    frequency: daily
    access: free
    rate_limit: 30
    params: {format: json, per_page: 10}
    json_path: "1"
    field_mapping: {id: indicator.id, title: country.value, content: value, source_url: ''}

  - name: Quandl/Nasdaq Data Link
    type: quandl
    url: https://data.nasdaq.com/api/v3/datasets/WIKI/AAPL.json
    quality_tier: 2
    frequency: daily
    access: api_key
    requires_key: true
    rate_limit: 5  # requests per minute (free tier)
    field_mapping: {id: dataset_code, title: name, content: description, source_url: ''}

  # Keyless finance news RSS feeds (added 2026-08-17 for #288) — keep the
  # flagship domain producing without third-party API keys. URLs verified live
  # (HTTP 200 with entries): CNBC 30 items, TheStreet 49.
  - name: CNBC Investing
    type: rss
    url: https://www.cnbc.com/id/100003114/device/rss/rss.html
    quality_tier: 1
    enabled: true
    tos_classification: open
    fetch_depth: abstract
    frequency: hourly
    access: free
    rate_limit: 30  # requests per minute

  - name: TheStreet
    type: rss
    url: https://www.thestreet.com/.rss/feed/a4a58455-5a41-4dfa-899c-86c49b653ed8.xml
    quality_tier: 1
    enabled: true
    tos_classification: open
    fetch_depth: abstract
    frequency: hourly
    access: free
    rate_limit: 30  # requests per minute

  # #288 keyless finance RSS (2026-08-17) + #6/#7 (2026-08-24): MarketWatch main
  # site is GFW-blocked but the feed domain (feeds.marketwatch.com) is reachable
  # (verified 2026-08-24, 10 entries parsed). Name matches regression-financial-sources.
  - name: MarketWatch Markets (DJ)
    type: rss
    url: https://feeds.marketwatch.com/marketwatch/topstories/
    quality_tier: 1
    enabled: true
    tos_classification: open
    fetch_depth: abstract
    frequency: hourly
    access: free
    rate_limit: 30  # requests per minute

  - name: WSJ Markets
    type: rss
    url: https://feeds.a.dj.com/rss/RSSMarketsMain.xml
    quality_tier: 1
    enabled: false
    tos_classification: licensed
    fetch_depth: abstract
    frequency: hourly
    access: free
    rate_limit: 30  # requests per minute
    settings:
      article_hosts:
        - https://www.wsj.com
        - https://online.wsj.com

topics:
  - name: "Listed Companies & Earnings"
    keywords:
      - earnings
      - quarterly results
      - revenue guidance
      - stock price
      - share buyback
      - dividend
      - IPO
      - ticker
  - name: "M&A & Financing"
    keywords:
      - merger
      - acquisition
      - M&A
      - takeover
      - funding round
      - private equity
      - venture capital
      - SPAC
      - deal announcement
  - name: "Macro & Policy"
    keywords:
      - GDP
      - inflation
      - federal reserve
      - interest rate
      - monetary policy
      - fiscal policy
      - economic data
      - consumer price index
      - payrolls
  - name: "Regulation & Compliance"
    keywords:
      - SEC
      - regulatory action
      - compliance
      - antitrust
      - banking regulation
      - capital requirements
      - enforcement
      - disclosure
      - governance
  - name: "Market Structure"
    keywords:
      - market index
      - S&P 500
      - Nasdaq
      - volatility
      - equity flows
      - market liquidity
      - derivatives
      - trading volume
      - market breadth
