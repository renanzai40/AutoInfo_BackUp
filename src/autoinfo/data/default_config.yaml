# AutoInfo default configuration template.
# Generated by `autoinfo init --demo <domain>`.
# See https://github.com/your-org/autoinfo#readme for documentation.

project:
  name: "My AutoInfo"
  # project_name: ""           # optional human-friendly project name
  created_at: "2026-07-20"

llm:
  provider: openrouter
  model: deepseek/deepseek-chat
  api_key: ${AUTOINFO_LLM_API_KEY}
  # base_url: "https://api.openai.com/v1"  # optional: custom API endpoint
  json_mode: false
  # reasoning_model: false  # set to true for reasoning models that don't support response_format
  # --- Judgment model (G4 factual / G5 translation / llm_judge) ---
  # Deployment override for the release-pinned JUDGMENT_MODEL.  When unset,
  # judgment calls use the release-pinned default (openai/deepseek-v4-flash);
  # deployments whose gateway serves a different model MUST set this so the
  # hard gates (G4/G5) actually judge instead of failing on a missing model.
  # judgment_model: openai/deepseek-v4-flash
  # --- Model pool (uncomment to configure; see configure_llm(llm_fallback=..., llm_tasks=...)) ---
  # fallback:
  #   - model: mimo-v2.5
  #     base_url: "https://opencode.ai/zen/go/v1"
  # tasks:
  #   extraction:
  #     model: deepseek-v4-flash
  #     provider: openai
  #     max_tokens: 4096

domains: []

