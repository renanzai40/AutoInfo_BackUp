# AutoInfo default configuration template.
# Generated by `autoinfo init --demo <domain>`.
# See https://github.com/your-org/autoinfo#readme for documentation.

project:
  name: "My AutoInfo"
  # project_name: ""           # optional human-friendly project name
  created_at: "2026-07-20"

llm:
  provider: openai
  model: openai/ark-code-latest
  base_url: https://ark.cn-beijing.volces.com/api/coding/v3
  api_key: ${AUTOINFO_LLM_API_KEY}
  json_mode: false
  reasoning_model: true
  # --- Model pool (fallback chain: primary ark → Command Code ox-alpha → Zhipu) ---
  fallback:
    - provider: openai
      model: glm-4.7-flash
      base_url: https://open.bigmodel.cn/api/paas/v4
      api_key: ${ZHIPU_API_KEY}
  # tasks:
  #   extraction:
  #     model: openai/ark-code-latest
  #     provider: openai
  #     max_tokens: 4096

domains: []

