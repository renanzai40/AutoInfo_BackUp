  - medical-research
  - ai-commercial
  - financial-intelligence
  - tech-ai-developer
  - language-learning
  - online-video
  - financial-news
  - online-education
  - legal-compliance
  - general-news
  - gaming
  - b2b
  - retail

# All 27 collector types registered in the MCP source-type registry
# (src/autoinfo/mcp/server.py SOURCE_TYPES).
