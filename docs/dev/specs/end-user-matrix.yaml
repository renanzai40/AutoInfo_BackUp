# End-User Coverage Matrix (E8, issue #131 — full-capability revision)
#
# AUTHORITATIVE 5-dimension matrix spec (v3): report demand surface -> code truth.
# Dimensions: A sources (29 types / 89 required sources), B products (8) x formats (8),
# C channels (14), D domains (13), E capabilities (15). Derived from
# docs/dev/research/综合报告-资讯付费与AI触达研究.md; calibrated against VALID_SOURCE_TYPES,
# PRODUCT_TEMPLATES, _CHANNEL_REGISTRY and the MCP tool registry.
#
# This revision fixes the spec drift found in the 2026-08-07 audit: the
# old spec declared only 13 required cells across 2 domains while the
# codebase implements 13 domains x 8 products x 8 formats x 29 sources.
# The required set now reflects the FULL report demand surface, calibrated to code truth.
#
# Statuses (rendered by scripts/coverage_matrix.py):
#   有produced             evidence found
#   空gap                  required cell with no evidence (LLM available)
#   不适用not-applicable   non-required cell with no evidence
#   未配置unconfigured     required cell whose product is LLM-gated while
#                          the LLM key is unavailable (NOT a gap)
#
