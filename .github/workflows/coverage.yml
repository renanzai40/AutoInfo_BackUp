# Changed-files coverage gate (gap C2).
#
# ci.yml runs the fast test subset but never measures coverage, so PRs can
# ship new modules with zero tests. This workflow runs the same fast subset
# under pytest-cov and then scopes the gate to the src/autoinfo modules the
# PR actually touched (same merge-base diff logic as ci.yml's changed-files
# ruff/mypy steps).
#
# Design decisions (why scoped, why baseline-aware):
#   - A repo-wide fail-under gate would be dragged down by untouched legacy
#     modules (e.g. server.py's 211 pre-existing lint rows — see ci.yml) and
#     would block unrelated PRs. Scoping the gate to changed modules ties the
#     requirement to the code the PR introduces.
#   - A fixed fail-under=60 on the WHOLE changed module still penalises
#     legacy modules: server.py sits at 53% on the fast subset, so any PR
#     touching it (even a one-line, fully-tested change) failed. The gate is
#     therefore baseline-aware (scripts/coverage_gate.py): each changed
#     module must keep at least its merge-base coverage (minus a 2pp
#     tolerance for run-to-run noise); NEW modules still must reach 60%.
#     This turns the gate into a true no-regression check.
#   - The base measurement runs the same fast subset in a git worktree at
#     the merge-base SHA — this roughly doubles this job's runtime (~9m →
#     ~18m) but keeps the baseline exact (no stale committed numbers).
#   - Only src/autoinfo changes count. Test-only PRs (tests/ changes, no
#     src/) cannot fail the gate — the job reports the skip explicitly.
#   - real_api tests are excluded exactly like ci.yml's fast subset.
#   - Fallback if the scoped include matches nothing (coverage stores
#     absolute paths on some runners): the gate script retries with a
#     wildcard prefix.

name: Coverage (changed files)

on:
  pull_request:

jobs:
  coverage:
    name: Fast subset coverage on changed modules
    runs-on: ubuntu-latest
    env:
      # Same TERM=dumb rationale as ci.yml: rich/typer emit ANSI escapes when
      # they detect a CI terminal (GITHUB_ACTIONS=true), which would break
      # help-substring assertions identically to local runs.
      TERM: dumb
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the merge-base diff below can see the PR's files.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libpango for weasyprint-adjacent PDF tests (same as ci.yml).
          sudo apt-get install -y libpango-1.0-0
      - name: Install package
        run: pip install -e ".[dev,ebook]"
      - name: Compute changed Python files
        run: |
          # Same merge-base pattern as ci.yml's ruff/mypy changed-files steps.
          BASE="$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)"
          echo "BASE_SHA=$BASE" >> "$GITHUB_ENV"
          mapfile -t FILES < <(git diff --name-only "$BASE" HEAD -- '*.py')
          : > changed-files.txt
          for f in "${FILES[@]}"; do echo "$f" >> changed-files.txt; done
          echo "changed Python files: ${#FILES[@]}"
      - name: Run fast subset with coverage (PR head)
        run: |
          set -o pipefail
          pytest -m "not real_api" --cov=src/autoinfo --cov-report=term-missing -q 2>&1 | tee coverage-pytest.log
          mv .coverage .coverage.pr
      - name: Measure base coverage (merge-base worktree)
        run: |
          set -uo pipefail
          # Only worth the second ~9m run when there IS a gated module.
          if ! grep -q '^src/autoinfo/.*\.py$' changed-files.txt; then
            echo "No changed src/autoinfo modules - base measurement skipped."
            exit 0
          fi
          git worktree add --detach "$RUNNER_TEMP/autoinfo-base" "$BASE_SHA"
          cd "$RUNNER_TEMP/autoinfo-base"
          # Re-install editable from the base worktree so `import autoinfo`
          # resolves to the base code (the earlier install points at HEAD).
          pip install -e ".[dev,ebook]" >/dev/null
          pytest -m "not real_api" --cov=src/autoinfo --cov-report=term-missing -q 2>&1 | tee "$GITHUB_WORKSPACE/coverage-base-pytest.log"
          cp .coverage "$GITHUB_WORKSPACE/.coverage.base"
          echo "Base coverage measured at $BASE_SHA"
      - name: Gate coverage on changed modules (baseline-aware)
        run: |
          python3 scripts/coverage_gate.py \
            --changed changed-files.txt \
            --pr-data .coverage.pr \
            --base-data .coverage.base \
            --base-sha "$BASE_SHA"
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data
          path: |
            coverage-pytest.log
            coverage-base-pytest.log
            .coverage.pr
            .coverage.base
          retention-days: 7
          if-no-files-found: ignore
