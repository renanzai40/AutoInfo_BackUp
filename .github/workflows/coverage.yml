# Changed-files coverage gate (gap C2).
#
# ci.yml runs the fast test subset but never measures coverage, so PRs can
# ship new modules with zero tests. This workflow runs the same fast subset
# under pytest-cov and then scopes the gate to the src/autoinfo modules the
# PR actually touched (same merge-base diff logic as ci.yml's changed-files
# ruff/mypy steps).
#
# Design decisions (why scoped, why this threshold):
#   - A repo-wide fail-under gate would be dragged down by untouched legacy
#     modules (e.g. server.py's 211 pre-existing lint rows — see ci.yml) and
#     would block unrelated PRs. Scoping the gate to changed modules ties the
#     requirement to the code the PR introduces.
#   - The threshold (60%) is an initial baseline, deliberately below the 80%
#     target: the suite currently carries 12 M1-deferred envelope failures
#     (tests/TRIAGE.md) and coverage is thin on some modules. Raise it as
#     coverage improves. The gate is REQUIRED (not continue-on-error) so a
#     new module without tests turns CI red immediately.
#   - Only src/autoinfo changes count. Test-only PRs (tests/ changes, no
#     src/) cannot fail the gate — the job reports the skip explicitly.
#   - real_api tests are excluded exactly like ci.yml's fast subset.
#   - Fallback if the scoped include matches nothing (coverage stores
#     absolute paths on some runners): retry with a wildcard prefix.

name: Coverage (changed files)

on:
  pull_request:

jobs:
  coverage:
    name: Fast subset coverage on changed modules
    runs-on: ubuntu-latest
    env:
      # Same TERM=dumb rationale as ci.yml: rich/typer emit ANSI escapes when
      # they detect a CI terminal (GITHUB_ACTIONS=true), which would break
      # help-substring assertions identically to local runs.
      TERM: dumb
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the merge-base diff below can see the PR's files.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libpango for weasyprint-adjacent PDF tests (same as ci.yml).
          sudo apt-get install -y libpango-1.0-0
      - name: Install package
        run: pip install -e ".[dev,ebook]"
      - name: Compute changed Python files
        run: |
          # Same merge-base pattern as ci.yml's ruff/mypy changed-files steps.
          BASE="$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)"
          mapfile -t FILES < <(git diff --name-only "$BASE" HEAD -- '*.py')
          : > changed-files.txt
          for f in "${FILES[@]}"; do echo "$f" >> changed-files.txt; done
          echo "changed Python files: ${#FILES[@]}"
      - name: Run fast subset with coverage
        run: |
          set -o pipefail
          pytest -m "not real_api" --cov=src/autoinfo --cov-report=term-missing -q 2>&1 | tee coverage-pytest.log
      - name: Gate coverage on changed modules
        run: |
          set -uo pipefail

          THRESHOLD=60  # initial baseline; raise toward 80 as coverage improves

          # Only src/autoinfo modules gate the PR: tests/ changes assert
          # behavior rather than shipping production code, so they cannot
          # lower coverage.
          mapfile -t SRC_FILES < <(grep '^src/autoinfo/.*\.py$' changed-files.txt || true)
          if [ "${#SRC_FILES[@]}" -eq 0 ]; then
            echo "No changed src/autoinfo modules - coverage gate skipped."
            exit 0
          fi

          # coverage report --include takes comma-separated fnmatch patterns
          # matched against the stored data file. Git-relative paths match
          # pytest-cov's report output; the */ fallback below covers runners
          # where coverage stores absolute paths.
          INCLUDE_REL="$(IFS=,; printf '%s' "${SRC_FILES[*]}")"
          INCLUDE_ABS="$(printf '*/%s,' "${SRC_FILES[@]}")"
          echo "Coverage gate on: ${SRC_FILES[*]} (fail-under: $THRESHOLD)"

          if ! coverage report --include="$INCLUDE_REL" --fail-under="$THRESHOLD" --skip-empty; then
            echo "Retrying with absolute-path patterns (coverage stored paths absolutely)."
            coverage report --include="${INCLUDE_ABS%,}" --fail-under="$THRESHOLD" --skip-empty
          fi
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: |
            coverage-pytest.log
            .coverage
          retention-days: 7
          if-no-files-found: ignore
