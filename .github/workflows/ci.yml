name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install ".[dev]"
      # Fast feedback on the PR's own diff.
      - name: Ruff on changed Python files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)"
          else
            BASE="$(git rev-parse HEAD^ 2>/dev/null || echo HEAD)"
          fi
          mapfile -t FILES < <(git diff --name-only "$BASE" HEAD -- '*.py')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed Python files - skipping ruff."
          else
            ruff check "${FILES[@]}"
          fi
      - name: Ruff gate on source
        run: ruff check --select E9,F --output-format=github src/
      # Full-src ruff: informational drift surface for the whole tree.
      # 863 pre-existing lint errors across the tree (E402×70, N806×27,
      # F841×18, F541×15, N803×15, F821×10, W292×5, ...; ruff 0.15.22,
      # line-length=100). Informational only — changed-files ruff (below) is
      # the required gate. Cleanup is a separate tracked work item.
      - name: Ruff on full source
        run: ruff check src/ tests/
        continue-on-error: true

  mypy-changed-files:
    name: Mypy (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package and dev dependencies
        run: pip install -e ".[dev]" types-PyYAML types-python-dateutil
      - name: Mypy on changed Python files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)"
          else
            BASE="$(git rev-parse HEAD^ 2>/dev/null || echo HEAD)"
          fi
          mapfile -t FILES < <(git diff --name-only "$BASE" HEAD -- '*.py')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed Python files - skipping mypy."
          else
            mypy --follow-imports=silent "${FILES[@]}"
          fi

  test:
    name: Test suite (fast subset)
    runs-on: ubuntu-latest
    env:
      # rich/typer render --help with ANSI escapes that split double-dash
      # flags (e.g. "--domain" -> "-" + "-domain") when it detects a CI
      # terminal (GITHUB_ACTIONS=true). TERM=dumb forces plain output so
      # help-substring assertions pass identically to local runs.
      TERM: dumb
    # Required job (was continue-on-error in #116). The suite currently carries
    # 12 documented M1-deferred envelope failures (tests/TRIAGE.md rows #73,
    # #74-83, #84) that M1T11-12 clears — read tests/TRIAGE.md before treating
    # red CI as a regression.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          # libpango for weasyprint-adjacent PDF tests; ffmpeg is skip-gated
          # and video tests skip via the PIL importorskip in conftest.
          sudo apt-get install -y libpango-1.0-0
      - name: Install package
        run: pip install -e ".[dev,ebook]"
      - name: Run fast test subset
        run: |
          set -o pipefail
          pytest -m "not real_api" -q 2>&1 | tee pytest-output.log
      - name: Append triage pointer on failure
        if: failure()
        run: |
          {
            echo ""
            echo "=== Failure triage pointer ==="
            echo "See tests/TRIAGE.md for the documented failure table."
            echo "The 12 M1-deferred envelope rows (#73, #74-83, #84) are cleared by M1T11-12."
          } >> pytest-output.log
      - name: Upload pytest output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: pytest-output.log
          retention-days: 7
