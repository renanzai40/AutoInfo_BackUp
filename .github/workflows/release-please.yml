# Release management (gap C5).
#
# release-please watches main. When conventional commits land (PR titles are
# gated by pr-title-check.yml, and AutoInfo squash-merges so the title is the
# commit), it opens a release PR that bumps src/autoinfo/_version.py and
# updates CHANGELOG.md; merging that PR cuts the GitHub release and tags the
# commit. The manifest (.release-please-manifest.json) pins the current
# version; the config (release-please-config.json) maps conventional commit
# types to changelog sections and declares the extra version files
# (src/autoinfo/_version.py via `extra-files` + `# x-release-please-version`
# annotation — release-type python only auto-discovers files named exactly
# version.py, so _version.py needs the explicit extra-files entry).
#
# IMPORTANT — do NOT add `release-type`/`package-name` action inputs here:
# when those inputs are set, the action builds an inline config and IGNORES
# release-please-config.json entirely (extra-files silently dropped; known
# release-please-action issue #975 / #1088). All release configuration lives
# in release-please-config.json; the action must take the config-file branch.
#
# BOT-PR APPROVAL (#275) — GitHub's 2026-06-11 security change requires
# manual approval before workflows run on PRs authored by github-actions[bot].
# Release-please creates the release PR as the bot, so all 6 required status
# checks concluded `action_required` with zero jobs and the release PR stayed
# blocked. Fix: release-please-action must authenticate as a human. A human
# with repo admin must run `gh secret set RELEASE_PLEASE_PAT` with a
# fine-grained PAT (Contents: read/write, Pull requests: read/write) for the
# fix to take effect; until then the `github.token` fallback below preserves
# the current (blocked) behavior rather than failing the workflow.
#
# Manual dispatch (workflow_dispatch) is an escape hatch: a stale or
# misleading tag can make release-please discover the wrong "latest version"
# (e.g. a pre-V1 baseline tag v0.9.0 computed the next release as 0.10.0
# instead of 1.9.0 — fixed 2026-08-15 by deleting that tag). NOTE: the
# `release-as` input below only takes effect when a release-type input is
# set, which is exactly what we must NOT do here — so for manual version
# pinning, push a commit containing `Release-As: x.y.z` (release-please's
# documented override) or edit the manifest directly.
#
# Input contract: squash-merge + Conventional Commits (pr-title-check.yml).
# Nothing here is ever edited by hand.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # release-please opens the release PR and pushes the version bump + tag.
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Open or update release PR
    runs-on: ubuntu-latest
    steps:
      - uses: GoogleCloudPlatform/release-please-action@v5
        with:
          # release-please-config.json and .release-please-manifest.json are
          # picked up automatically from the repo root. NO release-type /
          # package-name inputs — they would bypass the config file and drop
          # extra-files (see header note).
          # Human PAT when configured (unblocks bot-authored PRs, see header);
          # github.token fallback keeps prior behavior until then.
          token: ${{ secrets.RELEASE_PLEASE_PAT || github.token }}
